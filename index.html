<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Francia Online Bank Business Cards</title>

  <link rel="stylesheet" href="style.css">

  <!-- Google Fonts: Inter for general text & Poppins for branding -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <main class="card-container"> 

    <!-- FRONT CARD -->
    <section class="card card-front">

      <!-- Background Image Placed Directly Inside Card Container -->
      <img src="/images/BG.png" alt="Background" class="frontradial-background">

      <!-- Top Profile Section -->
      <div class="profile-info">
        <h1 class="person-name">Winjelyn F. Bacalso</h1>
        <p class="person-title">Managing Director</p>
      </div>

      <!-- Middle Contact Details -->
      <div class="contact-details">
        <p>francia@gmail.com</p>
        <p>www.francia.com</p>
        <p>639815307746</p>
      </div>

      <!-- Bottom Address & Brand Logo -->
      <div class="front-footer">
        <div class="location-info">
          <p>Lupon, Davao Oriental</p>
          <p>Philippines - 8207</p>
        </div>

        <div class="brand-logo">
          <img src="/images/francialogo.png" alt="Francia Bank Logo" class="brand-icon">
          
          <div class="brand-text">
            <span class="brand-name">FRANCIA</span>
            <span class="brand-sub">Online Bank</span>
          </div>
        </div>
      </div>
      
    </section>


    <!-- BACK CARD -->
    <section class="card card-back">

      <!-- Center Logo & Brand Section -->
      <div class="center-brand">
        <div class="brand-text">
          <span class="brand-name">FRANCIA</span>
          <span class="brand-sub">Online Bank</span>
        </div>
        <img src="/images/BG.png" alt="Background" class="radial-background">
        <img src="/images/francialogo.png" alt="Francia Bank Logo Watermark" class="center-watermark">
      </div>

      <!-- Bottom Partner Bank Logos -->
      <div class="partner-logos">
        <img src="/images/bpilogo.png" alt="BPI" class="partner-img">
        <img src="/images/bdologo.png" alt="BDO" class="partner-img">
        <img src="/images/landbanklogo.png" alt="Landbank" class="partner-img">
        <img src="/images/bsplogo.png" alt="Bangko Sentral ng Pilipinas" class="partner-img partner-round">
      </div>

    </section>

  </main>

</body>
</html>
